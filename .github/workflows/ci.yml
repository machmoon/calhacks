name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: sudo apt-get update && sudo apt-get install -y prusa-slicer
      - run: WRIGHT_PRUSASLICER=/usr/bin/prusa-slicer scripts/verify.sh --quick
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - run: cd lean && ! (lake build 2>&1 | grep "declaration uses 'sorry'")
