[package]
name = "wright-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wright-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
wright-core.workspace = true
wright-geom.workspace = true
wright-agents.workspace = true
wright-air.workspace = true
wright-rocket.workspace = true
wright-balloon.workspace = true
wright-guide = { path = "../wright-guide" }
# egui + eframe (emilk/egui 0.37.0); glow renderer for the 3D view, after
# examples/custom_3d_glow in that repo
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "links"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file", "gif"] }
# markdown checklists (lampsitter/egui_commonmark)
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images"] }
glam = "0.33"
csv = "1"
# glTF 2.0 assemblies from wright-cad (gltf-rs/gltf)
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "extras"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
wright-cad.workspace = true
