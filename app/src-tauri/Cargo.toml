[package]
name = "wright-app"
version = "0.3.1"
description = "Wright: describe a vehicle and an agent team designs it and checks every claim. A desktop workbench that drives the wright CLI."
authors = ["Patrick Liu"]
license = "GPL-3.0"
repository = "https://github.com/machmoon/calhacks"
homepage = "https://github.com/machmoon/calhacks"
documentation = "https://github.com/machmoon/calhacks"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "pcb", "kicad"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"
# The executable is "Wright" so an unbundled dev build is named Wright in the Dock
# tooltip and the app menu too; macOS takes that name from the process, and a
# bundle's productName only covers `tauri build`. The crate keeps its old name.
default-run = "Wright"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wright_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Wright"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` + `image-png`: the menu bar status item (src/tray.rs) and the
# `Image::from_bytes` that decodes its PNG glyphs.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-fs = "=2.4.2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
# tools.rs: stream KiCad/FreeCAD images with progress (rustls, as tauri-plugin-http already builds it) and check their SHA-256.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tauri-plugin-shell = "2.3.1"
portable-pty = "0.9"
tauri-plugin-notification = "2.4.0"
tauri-plugin-store = "2.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"

# The desktop shell has its own dependency graph and lockfile.
[workspace]
